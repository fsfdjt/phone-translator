plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.facetofacetranslator'
    compileSdk 35

    defaultConfig {
        applicationId 'com.example.facetofacetranslator'
        minSdk 26
        targetSdk 34
        versionCode 5
        versionName '0.4.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging {
        resources {
            excludes += ['META-INF/INDEX.LIST', 'META-INF/LICENSE', 'META-INF/LICENSE.txt',
                         'META-INF/NOTICE', 'META-INF/NOTICE.txt', 'META-INF/AL2.0',
                         'META-INF/LGPL2.1', 'META-INF/io.netty.versions.properties']
        }
    }
}

dependencies {
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
}
